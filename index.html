<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0e1a"/>
<title>Vortoria Client</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;font-family:system-ui,sans-serif;background:#0a0e1a;color:#e8eefc;overflow:hidden}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0a0e1a;z-index:20}
#boot.hid{display:none}
#boot h1{font-size:1.4rem;background:linear-gradient(135deg,#9ec1ff,#3dd6b0);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot p{color:#8b9bb8;font-size:.9rem}
.spin{width:36px;height:36px;border:3px solid #2a3550;border-top-color:#5b8cff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#hub{display:none;min-height:100%}
#hub.on{display:block}
header{display:flex;gap:8px;padding:10px 14px;background:#0c1220;border-bottom:1px solid #2a3550;flex-wrap:wrap;align-items:center}
.logo{font-weight:800;background:linear-gradient(135deg,#9ec1ff,#3dd6b0);-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{background:0;border:0;color:#8b9bb8;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
nav button.active,nav button:hover{color:#fff;background:#1a2438}
main{padding:16px;max-width:900px;margin:0 auto}
.card{background:#12182a;border:1px solid #2a3550;border-radius:12px;padding:14px;margin:10px 0}
.btn{background:linear-gradient(135deg,#4f7cff,#2ec9a0);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;color:#061018}
.btn.sec{background:rgba(255,255,255,.06);color:#e8eefc;border:1px solid #2a3550}
#play{display:none;position:fixed;inset:0;background:#05080f;z-index:9}
#play.on{display:block}
#c{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:10px;top:10px;background:#0008;padding:8px 10px;border-radius:8px;font-size:12px;pointer-events:none;z-index:10}
#leave{position:absolute;right:10px;top:10px;z-index:10}
#err{display:none;margin:12px 0;padding:10px;background:#3a1520;border:1px solid #a44;border-radius:8px;color:#ffb0b8;font-size:13px}
#err.on{display:block}
input{background:#0a0e1a;border:1px solid #2a3550;color:#fff;padding:8px;border-radius:8px;width:100%;margin:4px 0}
label{font-size:12px;color:#8b9bb8;display:block}
a.web{color:#3dd6b0;font-size:.85rem}

#mobileControls{display:none;position:fixed;inset:0;pointer-events:none;z-index:15}
#mobileControls.on{display:block}
.joy-zone{position:absolute;bottom:30px;width:140px;height:140px;pointer-events:auto;touch-action:none}
#joyLeft{left:25px}
.joy-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);position:relative}
.joy-stick{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.5);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#jumpBtn{
  position:absolute;bottom:40px;right:30px;
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(145deg,#5b8cff,#3a6df0);
  border:3px solid rgba(255,255,255,.4);
  color:#fff;font-weight:800;font-size:16px;
  pointer-events:auto;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(59,109,240,.5);
  user-select:none;
}
#jumpBtn:active{transform:scale(0.92)}
#zoomControls{
  position:absolute;right:20px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;z-index:15;pointer-events:auto;
}
.zoomBtn{
  width:48px;height:48px;border-radius:50%;
  background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.3);
  color:#fff;font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;
}
.zoomBtn:active{background:rgba(80,120,255,.5)}
</style>
</head>
<body>
<div id="boot">
  <div class="spin"></div>
  <h1>Vortoria Client</h1>
  <p id="bootMsg">Starting…</p>
</div>
<div id="hub">
<header>
  <div class="logo">Vortoria Client</div>
  <nav>
    <button type="button" class="active" data-v="home">Home</button>
    <button type="button" data-v="games">Experiences</button>
    <button type="button" data-v="servers">Servers</button>
  </nav>
  <a class="web" href="https://guestvrgt.github.io/vortex-recreation-blueprint/">← Website</a>
</header>
<main>
  <div id="err"></div>
  <section id="home">
    <div class="card">
      <h2>Client ready</h2>
      <p style="color:#8b9bb8;margin:8px 0 12px">Move where you look · Drag to look · JUMP · Zoom</p>
      <button class="btn" type="button" id="go">Play Playground</button>
    </div>
  </section>
  <section id="games" class="card" style="display:none">
    <button class="btn" type="button" data-game="playground">Playground</button>
    <button class="btn sec" type="button" data-game="obby" style="margin-left:8px">Obby Trial</button>
  </section>
  <section id="servers" class="card" style="display:none">
    <label>PlayFab Title</label><input id="pf" value="164E0A"/>
    <label>Photon Realtime</label><input id="pr" value="45b1dd1e-3c30-4f22-99b3-9f169625e7c9"/>
    <label>Photon Chat</label><input id="pc" value="0d2bdce2-f187-4b17-9fdd-5c22ace39794"/>
    <button class="btn" type="button" id="save" style="margin-top:8px">Save</button>
  </section>
</main>
</div>

<div id="play">
  <canvas id="c"></canvas>
  <div id="hud">Joining…</div>
  <button class="btn sec" type="button" id="leave">Leave</button>
  <div id="zoomControls">
    <div class="zoomBtn" id="zoomIn">+</div>
    <div class="zoomBtn" id="zoomOut">−</div>
  </div>
  <div id="mobileControls">
    <div class="joy-zone" id="joyLeft"><div class="joy-base"><div class="joy-stick" id="stickL"></div></div></div>
    <div id="jumpBtn">JUMP</div>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const gameId = (params.get('game') || params.get('place') || '').toLowerCase();
const autoPlay = params.get('play') === '1' || !!gameId;

function showErr(m){ const e=$('#err'); e.textContent=m; e.classList.add('on'); console.error(m); }

document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('active', x===b));
  ['home','games','servers'].forEach(id => $('#'+id).style.display = id===b.dataset.v ? 'block' : 'none');
});
$('#save').onclick = () => {
  localStorage.setItem('vortoria_servers', JSON.stringify({pf:pf.value, pr:pr.value, pc:pc.value}));
  alert('Saved on this device');
};

const PLACES = {
  playground: { name: 'Playground', color: 0x3d8f4a },
  obby: { name: 'Obby Trial', color: 0x4a3d8f }
};

// ========== STATE ==========
let running = 0, yaw = 0, pitch = 0.2, keys = {}, velY = 0, onG = 1, placeName = 'Playground';
let moveX = 0, moveZ = 0; // stick input: X = strafe, Z = forward/back
let walkCycle = 0;
let camDist = 5.5;
const CAM_DIST_MIN = 2.0;
const CAM_DIST_MAX = 12.0;
let isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || ('ontouchstart' in window);

let lookTouchId = null;
let lastLookX = 0, lastLookY = 0;

const STAND_Y = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8d8);
scene.fog = new THREE.Fog(0x87b8d8, 50, 100);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const player = new THREE.Group();
player.position.set(0, STAND_Y, 0);
scene.add(player);

const charRoot = new THREE.Group();
charRoot.scale.set(0.7, 0.7, 0.7);
player.add(charRoot);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(8, 20, 6);
scene.add(sun);

function buildMap(id) {
  scene.children.slice().forEach(c => {
    if (c === player || c.isLight) return;
    scene.remove(c);
  });
  const info = PLACES[id] || PLACES.playground;
  placeName = info.name;
  scene.background = new THREE.Color(0x87b8d8);

  const ground = new THREE.Mesh(
    new THREE.BoxGeometry(60, 1, 60),
    new THREE.MeshStandardMaterial({ color: info.color })
  );
  ground.position.y = -0.5;
  scene.add(ground);

  const pads = id === 'obby'
    ? [[0,0.5,-4],[2,1.2,-7],[-1,2,-10],[3,2.8,-13],[-2,3.5,-16],[0,4.2,-19]]
    : [[0,1,-6],[4,2,2],[-5,1.5,4]];
  pads.forEach(([x,y,z]) => {
    const h = Math.max(y * 2, 1);
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(id==='obby'?2.2:3, h, id==='obby'?2.2:3),
      new THREE.MeshStandardMaterial({ color: 0x6b7cff })
    );
    m.position.set(x, h/2, z);
    scene.add(m);
  });
}

new GLTFLoader().load(
  'https://cdn.jsdelivr.net/gh/GuestVRGT/huh@main/male.glb',
  (g) => {
    g.scene.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
    const box = new THREE.Box3().setFromObject(g.scene);
    g.scene.position.y = -box.min.y;
    charRoot.add(g.scene);
  },
  undefined,
  () => {
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.3, 0.8, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x5b8cff })
    );
    body.position.y = 0.7;
    charRoot.add(body);
  }
);

// ========== KEYBOARD ==========
window.addEventListener('keydown', e => {
  keys[e.code] = 1;
  if (e.code === 'Space') { e.preventDefault(); keys.jump = 1; }
});
window.addEventListener('keyup', e => { keys[e.code] = 0; });

// ========== MOUSE LOOK ==========
$('#c').addEventListener('click', () => {
  if (!isMobile) $('#c').requestPointerLock?.();
});
document.addEventListener('mousemove', e => {
  if (!running || document.pointerLockElement !== $('#c') || isMobile) return;
  yaw -= e.movementX * 0.0028;
  pitch += e.movementY * 0.0025;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
});

// ========== ZOOM ==========
window.addEventListener('wheel', e => {
  if (!running) return;
  e.preventDefault();
  camDist += e.deltaY * 0.008;
  camDist = Math.max(CAM_DIST_MIN, Math.min(CAM_DIST_MAX, camDist));
}, { passive: false });

$('#zoomIn').addEventListener('click', () => { camDist = Math.max(CAM_DIST_MIN, camDist - 0.8); });
$('#zoomOut').addEventListener('click', () => { camDist = Math.min(CAM_DIST_MAX, camDist + 0.8); });
$('#zoomIn').addEventListener('touchstart', e => { e.preventDefault(); camDist = Math.max(CAM_DIST_MIN, camDist - 0.8); }, {passive:false});
$('#zoomOut').addEventListener('touchstart', e => { e.preventDefault(); camDist = Math.min(CAM_DIST_MAX, camDist + 0.8); }, {passive:false});

// ========== TOUCH DRAG LOOK ==========
const canvas = $('#c');

canvas.addEventListener('touchstart', e => {
  if (!running) return;
  for (const t of e.changedTouches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && (el.closest('#joyLeft') || el.closest('#jumpBtn') || el.closest('#leave') || el.closest('#zoomControls'))) continue;
    if (lookTouchId === null) {
      lookTouchId = t.identifier;
      lastLookX = t.clientX;
      lastLookY = t.clientY;
    }
  }
}, {passive: true});

canvas.addEventListener('touchmove', e => {
  if (!running || lookTouchId === null) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) {
      const dx = t.clientX - lastLookX;
      const dy = t.clientY - lastLookY;
      lastLookX = t.clientX;
      lastLookY = t.clientY;

      yaw -= dx * 0.005;
      pitch += dy * 0.0042; // finger up = look up
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) lookTouchId = null;
  }
});
canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) lookTouchId = null;
  }
});

// ========== JOYSTICK ==========
function setupJoystick(zoneId, stickId) {
  const zone = $(zoneId), stick = $(stickId);
  let active = false, id = null;
  const maxR = 50;

  function getLocal(e, touch) {
    const r = zone.getBoundingClientRect();
    const t = touch || e;
    return {
      x: t.clientX - r.left - r.width / 2,
      y: t.clientY - r.top - r.height / 2
    };
  }

  function start(e) {
    e.preventDefault();
    e.stopPropagation();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    id = t.identifier ?? 'mouse';
    active = true;
  }

  function move(e) {
    if (!active) return;
    e.preventDefault();
    e.stopPropagation();
    let t = e;
    if (e.changedTouches) {
      t = [...e.changedTouches].find(x => x.identifier === id) || e.changedTouches[0];
    }
    const p = getLocal(e, t);
    let dx = p.x, dy = p.y;
    const len = Math.hypot(dx, dy);
    if (len > maxR) {
      dx = (dx / len) * maxR;
      dy = (dy / len) * maxR;
    }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    // Stick right = +X (strafe right)
    // Stick up   = -Y on screen → +forward
    moveX = dx / maxR;
    moveZ = -dy / maxR;
  }

  function end() {
    if (!active) return;
    active = false;
    id = null;
    stick.style.transform = 'translate(-50%,-50%)';
    moveX = 0;
    moveZ = 0;
  }

  zone.addEventListener('touchstart', start, {passive: false});
  zone.addEventListener('touchmove', move, {passive: false});
  zone.addEventListener('touchend', end);
  zone.addEventListener('touchcancel', end);
  zone.addEventListener('mousedown', start);
  window.addEventListener('mousemove', e => { if (active && id === 'mouse') move(e); });
  window.addEventListener('mouseup', end);
}

setupJoystick('#joyLeft', '#stickL');

function doJump() { keys.jump = 1; }
$('#jumpBtn').addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, {passive:false});
$('#jumpBtn').addEventListener('mousedown', doJump);

// ========== GAMEPAD ==========
function pollGamepad() {
  const pads = navigator.getGamepads?.() || [];
  const gp = pads[0] || pads[1];
  if (!gp) return;

  const lx = gp.axes[0];
  const ly = gp.axes[1];
  if (Math.abs(lx) > 0.15 || Math.abs(ly) > 0.15) {
    moveX = lx;
    moveZ = -ly;
  }

  const rx = Math.abs(gp.axes[2]) > 0.12 ? gp.axes[2] : 0;
  const ry = Math.abs(gp.axes[3]) > 0.12 ? gp.axes[3] : 0;
  yaw -= rx * 0.045;
  pitch += ry * 0.035;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));

  if (gp.buttons[0]?.pressed) keys.jump = 1;
}

// ========== GAME LOOP ==========
function start(id) {
  const gid = (id || 'playground').toLowerCase();
  buildMap(gid);
  running = 1;
  $('#play').classList.add('on');
  $('#hub').classList.remove('on');
  $('#boot').classList.add('hid');
  if (isMobile) $('#mobileControls').classList.add('on');
  player.position.set(0, STAND_Y, 0);
  velY = 0; yaw = 0; pitch = 0.2;
  moveX = 0; moveZ = 0;
  camDist = 5.5;
  lookTouchId = null;
  $('#hud').textContent = placeName + (isMobile ? ' · Move where you look' : ' · WASD · Mouse');
  onResize();
  last = performance.now();
  loop();
}
function stop() {
  running = 0;
  $('#play').classList.remove('on');
  $('#hub').classList.add('on');
  $('#mobileControls').classList.remove('on');
  document.exitPointerLock?.();
  if (location.search) history.replaceState({}, '', location.pathname);
}
$('#go').onclick = () => start('playground');
document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => start(b.dataset.game));
$('#leave').onclick = stop;

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);

let last = performance.now();
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  pollGamepad();

  // Keyboard overrides when held
  let kx = (keys.KeyD || 0) - (keys.KeyA || 0);
  let kz = (keys.KeyW || 0) - (keys.KeyS || 0);
  if (Math.abs(kx) + Math.abs(kz) > 0) {
    moveX = kx;
    moveZ = kz;
  }

  // Normalize input
  let inputX = moveX;
  let inputZ = moveZ;
  const len = Math.hypot(inputX, inputZ);
  if (len > 1) {
    inputX /= len;
    inputZ /= len;
  }

  // ===== CAMERA-RELATIVE MOVEMENT =====
  // Forward direction = the direction the camera is looking on the XZ plane
  // yaw = 0 means looking toward -Z
  const forwardX = -Math.sin(yaw);
  const forwardZ = -Math.cos(yaw);
  const rightX   =  Math.cos(yaw);
  const rightZ   = -Math.sin(yaw);

  // Combine: stick forward moves along camera forward, stick right strafes
  const worldX = forwardX * inputZ + rightX * inputX;
  const worldZ = forwardZ * inputZ + rightZ * inputX;

  const speed = 6.8;
  player.position.x += worldX * speed * dt;
  player.position.z += worldZ * speed * dt;

  // Jump + gravity
  if (keys.jump && onG) { velY = 8.5; onG = 0; keys.jump = 0; }
  velY -= 22 * dt;
  player.position.y += velY * dt;
  if (player.position.y <= STAND_Y) {
    player.position.y = STAND_Y;
    velY = 0;
    onG = 1;
  }

  // Rotate character to face movement direction
  const moving = Math.hypot(worldX, worldZ) > 0.05;
  if (moving) {
    const face = Math.atan2(worldX, worldZ);
    let cur = player.rotation.y;
    let d = face - cur;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    player.rotation.y = cur + d * Math.min(1, 14 * dt);

    walkCycle += dt * 11;
    charRoot.position.y = Math.sin(walkCycle) * 0.03;
    charRoot.rotation.z = Math.sin(walkCycle) * 0.05;
  } else {
    charRoot.position.y += (0 - charRoot.position.y) * 10 * dt;
    charRoot.rotation.z += (0 - charRoot.rotation.z) * 10 * dt;
  }

  // Instant camera follow
  const tx = player.position.x + Math.sin(yaw) * camDist * Math.cos(pitch);
  const ty = player.position.y + 1.5 + Math.sin(pitch) * camDist;
  const tz = player.position.z + Math.cos(yaw) * camDist * Math.cos(pitch);

  camera.position.set(tx, ty, tz);
  camera.lookAt(player.position.x, player.position.y + 1.15, player.position.z);

  renderer.render(scene, camera);
}

window.addEventListener('error', e => showErr(String(e.message || e)));
window.addEventListener('unhandledrejection', e => showErr(String(e.reason || e)));

$('#bootMsg').textContent = gameId ? ('Joining ' + (PLACES[gameId]?.name || gameId) + '…') : 'Loading client…';
setTimeout(() => {
  if (autoPlay) start(gameId || 'playground');
  else {
    $('#boot').classList.add('hid');
    $('#hub').classList.add('on');
  }
}, 350);
</script>
</body>
</html>
